name = "fluxixo-autopilot"
main = "src/index.js"
compatibility_date = "2026-10-21"
account_id = "a4be28e05f73ad2b3939d364ea8b2817"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "fluxixo-autopilot-db"
database_id = "595a7f4e-7004-4925-b77c-9bb4d1a0f9fe"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "fluxixo"

[vars]
SITE_ORIGIN = "https://www.fluxixo.shop"
MEDIA_ORIGIN = "https://media.fluxixo.shop"
INDEXNOW_KEY = "ededa82eb5716fb9ef71632b519559cb"
AI_PROVIDER = "cloudflare-workers-ai"
GITHUB_REPO = "sayros2601-hub/aliradar-pro"
DEFAULT_IMAGE_MODEL = "@cf/black-forest-labs/flux-2-klein-9b"
FALLBACK_IMAGE_MODEL = "@cf/black-forest-labs/flux-2-klein-4b"
DEFAULT_TEXT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
DEFAULT_VISION_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"

[observability]
enabled = true

[triggers]
# Israel time (Asia/Jerusalem, UTC+2 winter / UTC+3 summer):
# - 30 10-18 * * *: 13:30 prepare, 15:30 exact publish (winter 13:30 UTC & summer 12:30 UTC), plus hourly recovery.
# - 0 11-18 * * *: half-hour retry slots for deferred candidates; smart-skipped once published.
# - 17 5 * * *: morning SEO sync & Bing/Yandex IndexNow.
crons = ["30 10-18 * * *", "0 11-18 * * *", "17 5 * * *"]
