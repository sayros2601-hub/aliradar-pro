name: FLUXIXO daily SEO telemetry & Google/Bing sync

on:
  schedule:
    - cron: '25 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

# Share the same lock as the daily catalog build so commits never collide.
concurrency:
  group: fluxixo-daily-accumulation
  cancel-in-progress: false
  queue: max

jobs:
  seo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      FLUXIXO_CF_TEXT_MODEL: ${{ vars.FLUXIXO_CF_TEXT_MODEL || '@cf/meta/llama-3.3-70b-instruct-fp8-fast' }}
      FLUXIXO_AI_TRANSPORT: ${{ vars.FLUXIXO_AI_TRANSPORT || 'worker' }}
      CLOUDFLARE_AUTOPILOT_URL: https://fluxixo-autopilot.sayros2601.workers.dev
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SEO sync dependencies
        timeout-minutes: 5
        run: python -m pip install --retries 5 --timeout 60 google-auth requests cryptography

      - name: Run Google & Microsoft Bing daily sync & telemetry
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          SEO_DATA_KEY: ${{ secrets.SEO_DATA_KEY }}
          AUTOPILOT_SYNC_TOKEN: ${{ secrets.AUTOPILOT_SYNC_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B fluxixo_site/tools/seo_daily.py --summary "$GITHUB_STEP_SUMMARY"

      - name: Audit AliExpress affiliate links across catalog
        continue-on-error: true
        run: python -B link_health_guard.py --catalog fluxixo_site/dist/js/catalog.js --report data/link_health_report.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Check ops health & send weekly Telegram digest (Sunday)
        continue-on-error: true
        env:
          AUTOPILOT_SYNC_TOKEN: ${{ secrets.AUTOPILOT_SYNC_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -B -m fluxixo_ai.telegram_digest --mode alert --summary "$GITHUB_STEP_SUMMARY" || true
          if [ "$(date -u +%u)" = "7" ]; then
            python -B -m fluxixo_ai.telegram_digest --mode digest --weekly --write-json fluxixo_site/dist/telegram-digest.json || true
          fi

      - name: Persist encrypted SEO telemetry & link health state
        run: |
          git config user.name "FLUXIXO SEO Telemetry"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/seo ]; then git add data/seo/*.enc; fi
          if [ -f fluxixo_site/tools/indexnow-submitted.json ]; then git add -f fluxixo_site/tools/indexnow-submitted.json; fi
          for f in data/link_health_report.json data/telegram_digest_state.json; do
            if [ -f "$f" ]; then git add -f -- "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): daily Google/Bing sync telemetry [skip ci]"
            git pull --rebase --autostash --quiet origin main && git push origin HEAD:main
          fi

      - name: Sync SEO telemetry with Cloudflare Autopilot Worker (non-blocking)
        continue-on-error: true
        env:
          AUTOPILOT_SYNC_TOKEN: ${{ secrets.AUTOPILOT_SYNC_TOKEN }}
        run: |
          BASE_URL="${CLOUDFLARE_AUTOPILOT_URL%/}"
          if [ -z "$BASE_URL" ]; then
            echo "CLOUDFLARE_AUTOPILOT_URL is empty; skipping SEO sync ping."
            exit 0
          fi
          case "$BASE_URL" in
            */api/seo-sync) TARGET_URL="$BASE_URL" ;;
            *) TARGET_URL="$BASE_URL/api/seo-sync" ;;
          esac
          if [ -z "${AUTOPILOT_SYNC_TOKEN:-}" ]; then
            echo "AUTOPILOT_SYNC_TOKEN is unset. Skipping Worker SEO sync."
            exit 0
          fi
          PAYLOAD="{\"source\":\"github-actions\",\"workflow\":\"fluxixo_seo_daily\",\"project\":\"dealvault\",\"site\":\"https://www.fluxixo.shop\",\"brandColor\":\"#e4007c\",\"skip_indexnow\":true,\"sha\":\"$GITHUB_SHA\"}"
          curl -fsS --max-time 15 -X POST "$TARGET_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $AUTOPILOT_SYNC_TOKEN" \
            -d "$PAYLOAD" \
            || echo "Cloudflare Autopilot SEO sync unavailable (non-blocking)."
