name: FLUXIXO daily SEO watch & autonomous optimizer (Google, Bing, Yandex)

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Same lock as the daily product job, so the two never push to main at the same moment.
concurrency:
  group: fluxixo-daily-accumulation
  cancel-in-progress: false
  queue: max

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22 (for Cloudflare Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        timeout-minutes: 8
        run: |
          python -m pip install --retries 5 --timeout 60 google-auth requests cryptography pillow
          npm install --no-save wrangler

      - name: Run Google, Bing, Yandex watch + Stage-2 autonomous SEO optimization
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
          SEO_DATA_KEY: ${{ secrets.SEO_DATA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -B fluxixo_site/tools/seo_daily.py --apply --summary "$GITHUB_STEP_SUMMARY"

      - name: Deploy updated release only if SEO edits changed published site files
        id: changes
        run: |
          if [ -n "$(git status --porcelain fluxixo_site/tools/seo_overrides.json fluxixo_site/dist)" ]; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit encrypted SEO history and verified Stage-2 site improvements
        run: |
          git config user.name "FLUXIXO SEO Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data/seo ]; then git add data/seo/*.enc; fi
          if [ "${{ steps.changes.outputs.site_changed }}" = "true" ]; then
            git add -f fluxixo_site/tools/seo_overrides.json fluxixo_site/dist fluxixo_site/tools/search-build-state.json fluxixo_site/tools/sitemap-routes.json fluxixo_site/tools/yandex-indexnow-state.json fluxixo_site/release-manifest.json fluxixo_site/asset-map.json 2>/dev/null || true
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): autonomous daily SEO telemetry & verified upgrades [skip ci]"
            git pull --rebase --autostash --quiet origin main && git push origin HEAD:main
          fi

      - name: Deploy verified Stage-2 build to Cloudflare Pages & ping IndexNow
        if: steps.changes.outputs.site_changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4be28e05f73ad2b3939d364ea8b2817
        run: |
          python -B fluxixo_daily_rotate.py --add 0 --deploy --deploy-existing
          git add -f fluxixo_site/tools/indexnow-submitted.json fluxixo_site/tools/yandex-indexnow-state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): record Stage-2 IndexNow pings [skip ci]"
            git pull --rebase --autostash --quiet origin main && git push origin HEAD:main
          fi
