name: FLUXIXO offline pipeline checks

on:
  pull_request:
    paths:
      - '.github/workflows/fluxixo_pipeline_checks.yml'
      - '.github/workflows/fluxixo_daily_rotate.yml'
      - '.github/workflows/fluxixo_text_smoke.yml'
      - 'fluxixo_daily_rotate.py'
      - 'fluxixo_ai/autonomous.py'
      - 'fluxixo_ai/daily_schedule.py'
      - 'fluxixo_ai/gemini_client.py'
      - 'fluxixo_ai/image_studio.py'
      - 'fluxixo_ai/pending_products.py'
      - 'fluxixo_ai/reviewed_media.py'
      - 'fluxixo_ai/state_checkpoint.py'
      - 'fluxixo_ai/text_smoke.py'
      - 'fluxixo_site/tools/ai_seo.py'
      - 'fluxixo_site/tools/copy_originality.py'
      - 'fluxixo_site/tools/verify_release.py'
      - 'fluxixo_site/tools/legacy_media_baseline.json'
      - 'requirements.txt'
      - 'tests/test_gemini_client.py'
      - 'tests/test_gemini_text.py'
      - 'tests/test_pending_products.py'
      - 'tests/test_reviewed_media.py'
      - 'tests/test_state_checkpoint.py'
      - 'tests/test_text_smoke.py'
      - 'tests/test_release_media_baseline.py'
      - 'tests/test_fluxixo_daily_autonomous_integration.py'
      - 'tests/test_fluxixo_daily_schedule.py'
      - 'tests/test_google_aistudio_cloudflare_transport.py'

permissions:
  contents: read

concurrency:
  group: fluxixo-offline-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FLUXIXO_OFFLINE: '1'
      FLUXIXO_AI_TRANSPORT: disabled
      AUTOPILOT_SYNC_TOKEN: offline-placeholder
      CLOUDFLARE_API_TOKEN: offline-placeholder
      FLUXIXO_WEB_CHECK: '0'
    steps:
      - name: Checkout source and synthetic-test fixtures without media blobs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github
            fluxixo_ai
            fluxixo_site/tools
            tests
            data
            cloudflare_autopilot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ordinary test dependencies
        run: python -m pip install -r requirements.txt requests

      - name: Run scoped tests with network sockets disabled
        run: |
          python -B - <<'PY'
          import socket
          import unittest

          def no_network(*args, **kwargs):
              raise AssertionError('Network access is forbidden in offline pipeline tests')

          socket.create_connection = no_network
          socket.socket.connect = no_network
          socket.socket.connect_ex = no_network
          socket.getaddrinfo = no_network
          patterns = (
              'test_gemini_client.py', 'test_gemini_text.py',
              'test_pending_products.py', 'test_reviewed_media.py',
              'test_state_checkpoint.py', 'test_text_smoke.py',
              'test_release_media_baseline.py',
              'test_fluxixo_daily_autonomous_integration.py',
              'test_fluxixo_daily_schedule.py',
              'test_google_aistudio_cloudflare_transport.py',
          )
          loader = unittest.TestLoader()
          suite = unittest.TestSuite(loader.discover('tests', pattern=name) for name in patterns)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
