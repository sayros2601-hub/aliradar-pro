name: FLUXIXO daily update (15:30 Israel, max 3 products)

on:
  schedule:
    # Israel schedule (Asia/Jerusalem, UTC+2 winter / UTC+3 summer): prepare from 13:30, publish at 15:30.
    # These UTC crons are fallbacks; primary triggers run on the Cloudflare Worker (fluxixo-autopilot).
    - cron: '35 10 * * *'
    - cron: '35 11 * * *'
    - cron: '35 12 * * *'
    - cron: '35 13 * * *'
    - cron: '5 14-20 * * *'
  workflow_dispatch:
    inputs:
      add_count:
        description: 'auto follows daily schedule rules; 0 rebuilds without new images; 1-3 requests remaining daily allowance'
        required: false
        default: 'auto'

permissions:
  contents: write
  models: read

concurrency:
  group: fluxixo-daily-accumulation
  cancel-in-progress: false
  queue: max

jobs:
  accumulate-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      LEDGER: data/fluxixo_daily_ledger.json
      PUBLISH_STATE: data/fluxixo_publish_state.json
      # New cards require exact-version Gemini review. Shared Paid Workers AI usage
      # has no enforceable free cap, so reviewed media uses authentic seller cutouts
      # until an account-wide no-overage reservation can be established.
      FLUXIXO_REVIEW_REQUIRED: '1'
      FLUXIXO_REVIEW_STATE_DIR: fluxixo_site/reserve/reviewed-media
      FLUXIXO_GEMINI_BUDGET_PATH: data/fluxixo_gemini_usage.sqlite3
      FLUXIXO_DURABLE_CHECKPOINT: git
      FLUXIXO_IMAGE_MODE: generate
      FLUXIXO_IMAGE_PROVIDER: cloudflare
      FLUXIXO_DIRECT_STUDIO_BG: '0'
      FLUXIXO_USE_VISION_SPEC: '1'
      FLUXIXO_STRICT_COPY: '1'
      FLUXIXO_CF_TEXT_MODEL: ${{ vars.FLUXIXO_CF_TEXT_MODEL || '@cf/meta/llama-3.3-70b-instruct-fp8-fast' }}
      FLUXIXO_CF_IMAGE_MODEL: ${{ vars.FLUXIXO_CF_IMAGE_MODEL || '@cf/black-forest-labs/flux-2-klein-9b' }}
      FLUXIXO_CF_VISION_MODEL: ${{ vars.FLUXIXO_CF_VISION_MODEL || '@cf/meta/llama-4-scout-17b-16e-instruct' }}
      FLUXIXO_AI_TRANSPORT: ${{ vars.FLUXIXO_AI_TRANSPORT || 'worker' }}
      CLOUDFLARE_AUTOPILOT_URL: https://fluxixo-autopilot.sayros2601.workers.dev
      CLOUDFLARE_ACCOUNT_ID: a4be28e05f73ad2b3939d364ea8b2817
    steps:
      - name: Checkout latest main after the shared lock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve evening batch, reserved allowance and publication recovery
        id: today
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COUNT: ${{ github.event.inputs.add_count || 'auto' }}
        run: |
          INPUT_COUNT="${INPUT_COUNT//[[:space:]]/}"
          case "${EVENT_NAME}:${INPUT_COUNT}" in
            workflow_dispatch:0|workflow_dispatch:1|workflow_dispatch:2|workflow_dispatch:3)
              python3 -B -m fluxixo_ai.daily_schedule plan --ledger "$LEDGER" --state "$PUBLISH_STATE" --output "$GITHUB_OUTPUT" --manual-count "$INPUT_COUNT"
              ;;
            *)
              python3 -B -m fluxixo_ai.daily_schedule plan --ledger "$LEDGER" --state "$PUBLISH_STATE" --output "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Python 3.12
        if: steps.today.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        if: steps.today.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bounded OCR dependencies only for new products
        if: steps.today.outputs.action == 'prepare' && env.FLUXIXO_IMAGE_MODE != 'generate'
        timeout-minutes: 15
        run: bash .github/scripts/install_ocr.sh

      - name: Install build dependencies
        if: steps.today.outputs.skip != 'true'
        timeout-minutes: 10
        env:
          ACTION: ${{ steps.today.outputs.action }}
        run: |
          python -m pip install --retries 5 --timeout 60 -r requirements.txt requests
          if [ "$ACTION" = "prepare" ]; then
            python -m pip install --retries 5 --timeout 60 rembg onnxruntime
          fi
          npm ci --ignore-scripts

      - name: Configure catalog writer
        id: writer
        if: steps.today.outputs.skip != 'true'
        run: |
          git config user.name "FLUXIXO Cloud Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Persist image allowance before any new generation
        if: steps.today.outputs.action == 'prepare'
        env:
          DAY: ${{ steps.today.outputs.day }}
          ADD_COUNT: ${{ steps.today.outputs.add_count }}
        run: |
          python -B -m fluxixo_ai.daily_schedule reserve --ledger "$LEDGER" --state "$PUBLISH_STATE" --day "$DAY" --count "$ADD_COUNT"
          git add "$PUBLISH_STATE"
          git commit -m "chore(fluxixo): reserve daily image allowance [skip ci]"
          git push origin HEAD:main

      - name: Prepare one bounded batch without building or publishing
        id: prepare
        if: steps.today.outputs.action == 'prepare'
        timeout-minutes: 55
        env:
          FLUXIXO_TEXT_PROVIDER: gemini
          FLUXIXO_TEXT_GEMINI_API_KEY: ${{ secrets.FLUXIXO_TEXT_GEMINI_API_KEY }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          AUTOPILOT_SYNC_TOKEN: ${{ secrets.AUTOPILOT_SYNC_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADD_COUNT: ${{ steps.today.outputs.add_count }}
          MARKETS: ${{ steps.today.outputs.markets }}
          # Free-tier Tavily API key (1,000 free searches/month, strictly capped at 30/day in SQLite).
          FLUXIXO_WEB_CHECK: '1'
          FLUXIXO_WEB_CHECK_PROVIDER: tavily_free
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Batch frequent mid-run checkpoints to avoid git push storms; the always() step flushes final state.
          FLUXIXO_CHECKPOINT_MIN_INTERVAL: '20'
        run: |
          # Text: Gemini 3.5 Flash-Lite HIGH. Review: Gemini 3.8 Flash HIGH.
          # Both use only the dedicated Free Tier secret; no alternate paid provider.
          test -n "$FLUXIXO_TEXT_GEMINI_API_KEY" || { echo 'Missing FLUXIXO_TEXT_GEMINI_API_KEY'; exit 1; }
          python -B fluxixo_daily_rotate.py --add "$ADD_COUNT" --markets "$MARKETS" --prepare-only

      - name: Checkpoint internal retry state even if preparation failed
        if: always() && steps.today.outputs.action == 'prepare' && steps.writer.outcome == 'success'
        run: python -B -m fluxixo_ai.state_checkpoint

      - name: Persist prepared products and their images before building pages
        if: success() && steps.prepare.outcome == 'success'
        env:
          DAY: ${{ steps.today.outputs.day }}
          RECORD_PUBLICATION: ${{ steps.today.outputs.record_publication }}
        run: |
          if [ "$RECORD_PUBLICATION" = "true" ]; then
            python -B -m fluxixo_ai.daily_schedule mark-prepared --ledger "$LEDGER" --state "$PUBLISH_STATE" --day "$DAY" --allow-partial
          fi
          git add -- fluxixo_site/dist fluxixo_site/reserve fluxixo_site/tools "$LEDGER" "$PUBLISH_STATE"
          git reset -q HEAD -- fluxixo_site/dist/assets/thumbs 2>/dev/null || true
          # Per-frame seller references and canonical identity are private source assets.
          shopt -s nullglob
          references=(fluxixo_site/dist/assets/originals/*-review-*.png fluxixo_site/dist/assets/originals/*-identity.png)
          if (( ${#references[@]} )); then git add -f -- "${references[@]}"; fi
          if [ -f data/fluxixo_ai.sqlite3 ]; then git add -f data/fluxixo_ai.sqlite3; fi
          for state in data/fluxixo_pending.sqlite3 "$FLUXIXO_GEMINI_BUDGET_PATH" data/fluxixo_free_search.sqlite3; do
            if [ -e "$state" ]; then git add -f -- "$state"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): save prepared daily catalog [skip ci]"
            git push origin HEAD:main
          fi

      - name: Mark queued AI items committed only after verified push
        if: steps.prepare.outputs.ids != ''
        env:
          NEW_IDS: ${{ steps.prepare.outputs.ids }}
        run: |
          python -B -m fluxixo_ai.autonomous --mark-committed "$(git rev-parse HEAD)" --ids "$NEW_IDS"
          if [ -f data/fluxixo_ai.sqlite3 ]; then git add -f data/fluxixo_ai.sqlite3; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): record committed AI queue items [skip ci]"
            git push origin HEAD:main
          fi

      - name: Refresh publication date and evening window after preparation
        id: publication
        if: steps.today.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COUNT: ${{ github.event.inputs.add_count || 'auto' }}
        run: |
          INPUT_COUNT="${INPUT_COUNT//[[:space:]]/}"
          case "${EVENT_NAME}:${INPUT_COUNT}" in
            workflow_dispatch:0)
              python -B -m fluxixo_ai.daily_schedule plan --ledger "$LEDGER" --state "$PUBLISH_STATE" --output "$GITHUB_OUTPUT" --manual-count 0
              ;;
            *)
              python -B -m fluxixo_ai.daily_schedule plan --ledger "$LEDGER" --state "$PUBLISH_STATE" --output "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build and verify all six languages without new images
        if: steps.publication.outputs.action == 'recover'
        env:
          DAY: ${{ steps.publication.outputs.publication_day }}
          RECORD_PUBLICATION: ${{ steps.today.outputs.record_publication }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          AUTOPILOT_SYNC_TOKEN: ${{ secrets.AUTOPILOT_SYNC_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RECORD_PUBLICATION" = "true" ]; then export FLUXIXO_PREPARED_PUBLISH_DAY="$DAY"; fi
          python -B fluxixo_daily_rotate.py --add 0 --refresh-clean-links
          git add -- fluxixo_site/dist fluxixo_site/tools
          git reset -q HEAD -- fluxixo_site/dist/assets/thumbs 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): build evening release and countdown [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish prepared release at the evening window
        if: steps.publication.outputs.action == 'recover' && steps.publication.outputs.publish == 'true'
        timeout-minutes: 15
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COUNT: ${{ github.event.inputs.add_count || 'auto' }}
          DAY: ${{ steps.publication.outputs.publication_day }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4be28e05f73ad2b3939d364ea8b2817
          AUTOPILOT_SYNC_TOKEN: ${{ secrets.AUTOPILOT_SYNC_TOKEN }}
        run: |
          INPUT_COUNT="${INPUT_COUNT//[[:space:]]/}"
          case "${EVENT_NAME}:${INPUT_COUNT}" in
            workflow_dispatch:0)
              python -B -m fluxixo_ai.daily_schedule guard-publication --ledger "$LEDGER" --state "$PUBLISH_STATE" --day "$DAY" --manual-count 0
              ;;
            *)
              python -B -m fluxixo_ai.daily_schedule guard-publication --ledger "$LEDGER" --state "$PUBLISH_STATE" --day "$DAY"
              ;;
          esac
          python -B fluxixo_daily_rotate.py --add 0 --deploy --deploy-existing

      - name: Record success only after deployment completes
        if: steps.publication.outputs.action == 'recover' && steps.publication.outputs.publish == 'true'
        env:
          DAY: ${{ steps.today.outputs.day }}
          RECORD_PUBLICATION: ${{ steps.today.outputs.record_publication }}
          AUTOPILOT_SYNC_TOKEN: ${{ secrets.AUTOPILOT_SYNC_TOKEN }}
        run: |
          if [ "$RECORD_PUBLICATION" = "true" ]; then
            python -B -m fluxixo_ai.daily_schedule mark-published --ledger "$LEDGER" --state "$PUBLISH_STATE" --day "$DAY"
          fi
          git add "$PUBLISH_STATE"
          git add -f fluxixo_site/tools/indexnow-submitted.json fluxixo_site/tools/yandex-indexnow-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): record published daily batch [skip ci]"
            git push origin HEAD:main
          fi
          python -B -c "import fluxixo_daily_rotate as d; d.report_autopilot_sync('published', {'day': '$DAY'})" || true

      - name: Report waiting preparation
        if: steps.today.outputs.reason == 'interrupted_prepare'
        run: |
          echo "::notice::Preparation is waiting for its bounded retry window. Pending candidates and reviewed assets are retained."
