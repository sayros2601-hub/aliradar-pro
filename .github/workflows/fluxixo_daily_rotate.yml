name: FLUXIXO Daily Cloud Product Accumulation (+3 per day, 0 deleted)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      add_count:
        description: 'Number of new products to add (default 3; 0 to rebuild & deploy only; never deletes existing items)'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: fluxixo-daily-accumulation
  cancel-in-progress: false

jobs:
  accumulate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22 (for Cloudflare Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests pillow rembg onnxruntime
          npm install --no-save wrangler

      - name: Add +3 new products (0 deleted), rebuild FLUXIXO release, and deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4be28e05f73ad2b3939d364ea8b2817
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ADD_COUNT: ${{ github.event_name == 'schedule' && '3' || github.event.inputs.add_count || '3' }}
        run: |
          python fluxixo_daily_rotate.py --add "$ADD_COUNT" --deploy

      - name: Commit accumulated FLUXIXO catalog and reserve pool
        run: |
          git config user.name "FLUXIXO Cloud Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fluxixo_site/dist fluxixo_site/reserve fluxixo_site/tools
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): daily cloud accumulation (+3 new products, 0 deleted) [skip ci]"
            git push origin HEAD:main
          fi
