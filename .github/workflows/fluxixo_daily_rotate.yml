name: FLUXIXO Staggered Peak-Hour Cloud Product Accumulation (1 per peak wave, max 3/day)

on:
  schedule:
    # Staggered prime-time browsing windows across all 6 target countries (+1 item per wave, 3/day max):
    # - 01:00 UTC: US (17:00-21:00) & Mexico (19:00 CST) evening prime peak
    # - 17:00 UTC: Russia (20:00 MSK), Israel (19:00 IST) & France (18:00 CET) evening prime peak
    # - 21:00 UTC: Brazil (18:00-19:00 BRT) evening prime & US/MX late afternoon
    # - 22:30 UTC: Catch-up safety wave (runs +1 only if an earlier slot failed & done < 3)
    - cron: '0 1 * * *'
    - cron: '0 17 * * *'
    - cron: '0 21 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      add_count:
        description: 'Number of new products to add (default 3; 0 to rebuild & deploy only; never deletes existing items)'
        required: false
        default: '3'
      preferred_markets:
        description: 'Optional comma-separated market focus for manual runs (e.g. RU,IL,FR)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fluxixo-daily-accumulation
  cancel-in-progress: false
  queue: max

jobs:
  accumulate-and-deploy:
    runs-on: ubuntu-latest
    # Three cut-out photos per product (up to 9 rembg passes per candidate) need generous timeout headroom.
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout latest main after the shared lock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve staggered peak-hour wave and daily quota
        id: today
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_COUNT: ${{ github.event.inputs.add_count || '3' }}
          INPUT_MARKETS: ${{ github.event.inputs.preferred_markets || '' }}
        run: |
          python3 - <<'EOF'
          import json, os
          from datetime import datetime, timezone
          from fluxixo_ai.discovery_curator import resolve_peak_slot
          now_utc = datetime.now(timezone.utc)
          day = now_utc.date().isoformat()
          done = len(json.load(open('data/fluxixo_daily_ledger.json', encoding='utf-8'))['days'].get(day, []))
          if os.environ.get('EVENT_NAME') == 'schedule':
              slot = resolve_peak_slot(now_utc, cron_expr=os.environ.get('EVENT_SCHEDULE'), done_today=done)
              skip = slot['skip']
              add_count = slot['add_count']
              markets = ','.join(slot['preferred_markets'])
              slot_id = slot['id']
              print(f"{day}: done={done}/3, slot={slot_id} ({slot['window_note']}), add_count={add_count}, skip={skip}")
          else:
              add_count = int(os.environ.get('INPUT_COUNT') or '3')
              skip = False
              markets = os.environ.get('INPUT_MARKETS', '').strip()
              slot_id = 'manual'
              print(f"{day}: manual dispatch done={done}/3, add_count={add_count}, markets={markets or 'all'}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"skip={'true' if skip else 'false'}\n")
              out.write(f"add_count={add_count}\n")
              out.write(f"markets={markets}\n")
              out.write(f"slot_id={slot_id}\n")
          EOF

      - name: Set up Python 3.12
        if: steps.today.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22 (for Cloudflare Wrangler)
        if: steps.today.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OCR (apt with a time limit, conda-forge if the Ubuntu mirrors are down)
        if: steps.today.outputs.skip != 'true'
        timeout-minutes: 15
        run: bash .github/scripts/install_ocr.sh

      - name: Install Python dependencies and Wrangler
        if: steps.today.outputs.skip != 'true'
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 requests pillow rembg onnxruntime
          npm install --no-save wrangler

      - name: Prepare source-grounded products for active slot and build release
        id: prepare
        if: steps.today.outputs.skip != 'true'
        timeout-minutes: 55
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4be28e05f73ad2b3939d364ea8b2817
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADD_COUNT: ${{ steps.today.outputs.add_count || '3' }}
          PEAK_MARKETS: ${{ steps.today.outputs.markets }}
        run: |
          if [ -n "$PEAK_MARKETS" ]; then
            python -B fluxixo_daily_rotate.py --add "$ADD_COUNT" --markets "$PEAK_MARKETS"
          else
            python -B fluxixo_daily_rotate.py --add "$ADD_COUNT"
          fi

      - name: Commit accumulated FLUXIXO catalog and reserve pool
        if: steps.today.outputs.skip != 'true'
        run: |
          git config user.name "FLUXIXO Cloud Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fluxixo_site/dist fluxixo_site/reserve fluxixo_site/tools data/fluxixo_daily_ledger.json fluxixo_site/release-manifest.json fluxixo_site/asset-map.json
          if [ -f data/fluxixo_ai.sqlite3 ]; then git add -f data/fluxixo_ai.sqlite3; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): peak-slot accumulation (+${{ steps.prepare.outputs.added || 0 }} new, slot ${{ steps.today.outputs.slot_id }}) [skip ci]"
            git push origin HEAD:main
          fi

      - name: Mark queued AI items committed only after verified push
        if: steps.today.outputs.skip != 'true'
        env:
          NEW_IDS: ${{ steps.prepare.outputs.ids }}
        run: |
          python -B -m fluxixo_ai.autonomous --mark-committed "$(git rev-parse HEAD)" --ids "$NEW_IDS"
          if [ -f data/fluxixo_ai.sqlite3 ]; then git add -f data/fluxixo_ai.sqlite3; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): record committed AI queue items [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy the already-built release only after catalog and ledger push
        if: steps.today.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4be28e05f73ad2b3939d364ea8b2817
        run: python -B fluxixo_daily_rotate.py --add 0 --deploy --deploy-existing

      - name: Remember which page versions search engines were told about
        if: steps.today.outputs.skip != 'true'
        run: |
          git add -f fluxixo_site/tools/indexnow-submitted.json fluxixo_site/tools/yandex-indexnow-state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): record IndexNow submissions [skip ci]"
            # The deploy step leaves rebuilt, uncommitted release files behind; set them aside while syncing.
            git pull --rebase --autostash --quiet origin main && git push origin HEAD:main
          fi
