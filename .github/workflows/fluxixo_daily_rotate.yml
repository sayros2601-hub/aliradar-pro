name: FLUXIXO daily evening update (19:00 Israel, max 3 products)

on:
  schedule:
    # Prepare ahead of time; publish the same batch at 19:00 Israel (DST-aware).
    - cron: '30 17 * * *'
      timezone: Asia/Jerusalem
    - cron: '0 19 * * *'
      timezone: Asia/Jerusalem
    # Bounded recovery checks; a completed day skips before dependency installation.
    - cron: '17 19 * * *'
      timezone: Asia/Jerusalem
    - cron: '47 20 * * *'
      timezone: Asia/Jerusalem
  workflow_dispatch:
    inputs:
      add_count:
        description: '0 rebuilds without new images; 1-3 requests remaining daily allowance'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: fluxixo-daily-accumulation
  cancel-in-progress: false
  queue: max

jobs:
  accumulate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LEDGER: data/fluxixo_daily_ledger.json
      PUBLISH_STATE: data/fluxixo_publish_state.json
    steps:
      - name: Checkout latest main after the shared lock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve evening batch, reserved allowance and publication recovery
        id: today
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COUNT: ${{ github.event.inputs.add_count || '0' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 -B -m fluxixo_ai.daily_schedule plan --ledger "$LEDGER" --state "$PUBLISH_STATE" --output "$GITHUB_OUTPUT" --manual-count "$INPUT_COUNT"
          else
            python3 -B -m fluxixo_ai.daily_schedule plan --ledger "$LEDGER" --state "$PUBLISH_STATE" --output "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.today.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        if: steps.today.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bounded OCR dependencies only for new products
        if: steps.today.outputs.action == 'prepare'
        timeout-minutes: 15
        run: bash .github/scripts/install_ocr.sh

      - name: Install build dependencies
        if: steps.today.outputs.skip != 'true'
        timeout-minutes: 10
        env:
          ACTION: ${{ steps.today.outputs.action }}
        run: |
          python -m pip install --retries 5 --timeout 60 -r requirements.txt requests
          if [ "$ACTION" = "prepare" ]; then
            python -m pip install --retries 5 --timeout 60 rembg onnxruntime
          fi
          npm ci --ignore-scripts

      - name: Configure catalog writer
        if: steps.today.outputs.skip != 'true'
        run: |
          git config user.name "FLUXIXO Cloud Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Persist image allowance before any new generation
        if: steps.today.outputs.action == 'prepare'
        env:
          DAY: ${{ steps.today.outputs.day }}
          ADD_COUNT: ${{ steps.today.outputs.add_count }}
        run: |
          python -B -m fluxixo_ai.daily_schedule reserve --ledger "$LEDGER" --state "$PUBLISH_STATE" --day "$DAY" --count "$ADD_COUNT"
          git add "$PUBLISH_STATE"
          git commit -m "chore(fluxixo): reserve daily image allowance [skip ci]"
          git push origin HEAD:main

      - name: Prepare one bounded batch without building or publishing
        id: prepare
        if: steps.today.outputs.action == 'prepare'
        timeout-minutes: 55
        env:
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADD_COUNT: ${{ steps.today.outputs.add_count }}
          MARKETS: ${{ steps.today.outputs.markets }}
          FLUXIXO_MAX_MEDIA_PRODUCTS: ${{ steps.today.outputs.add_count }}
          FLUXIXO_STRICT_COPY: '1'
        run: python -B fluxixo_daily_rotate.py --add "$ADD_COUNT" --markets "$MARKETS" --prepare-only

      - name: Persist prepared products and their images before building pages
        if: steps.today.outputs.skip != 'true'
        env:
          DAY: ${{ steps.today.outputs.day }}
          RECORD_PUBLICATION: ${{ steps.today.outputs.record_publication }}
        run: |
          if [ "$RECORD_PUBLICATION" = "true" ]; then
            python -B -m fluxixo_ai.daily_schedule mark-prepared --ledger "$LEDGER" --state "$PUBLISH_STATE" --day "$DAY"
          fi
          git add -f fluxixo_site/dist fluxixo_site/reserve fluxixo_site/tools "$LEDGER" "$PUBLISH_STATE"
          if [ -f data/fluxixo_ai.sqlite3 ]; then git add -f data/fluxixo_ai.sqlite3; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): save prepared daily catalog [skip ci]"
            git push origin HEAD:main
          fi

      - name: Mark queued AI items committed only after verified push
        if: steps.prepare.outputs.ids != ''
        env:
          NEW_IDS: ${{ steps.prepare.outputs.ids }}
        run: |
          python -B -m fluxixo_ai.autonomous --mark-committed "$(git rev-parse HEAD)" --ids "$NEW_IDS"
          if [ -f data/fluxixo_ai.sqlite3 ]; then git add -f data/fluxixo_ai.sqlite3; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): record committed AI queue items [skip ci]"
            git push origin HEAD:main
          fi

      - name: Refresh publication date and evening window after preparation
        id: publication
        if: steps.today.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python -B -m fluxixo_ai.daily_schedule plan --ledger "$LEDGER" --state "$PUBLISH_STATE" --output "$GITHUB_OUTPUT" --manual-count 0
          else
            python -B -m fluxixo_ai.daily_schedule plan --ledger "$LEDGER" --state "$PUBLISH_STATE" --output "$GITHUB_OUTPUT"
          fi

      - name: Build and verify all six languages without new images
        if: steps.today.outputs.skip != 'true'
        env:
          DAY: ${{ steps.publication.outputs.publication_day }}
          RECORD_PUBLICATION: ${{ steps.today.outputs.record_publication }}
        run: |
          if [ "$RECORD_PUBLICATION" = "true" ]; then export FLUXIXO_PREPARED_PUBLISH_DAY="$DAY"; fi
          python -B fluxixo_daily_rotate.py --add 0
          git add -f fluxixo_site/dist fluxixo_site/tools fluxixo_site/release-manifest.json fluxixo_site/asset-map.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): build evening release and countdown [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish prepared release at the evening window
        if: steps.today.outputs.skip != 'true' && steps.publication.outputs.publish == 'true'
        timeout-minutes: 15
        env:
          EVENT_NAME: ${{ github.event_name }}
          DAY: ${{ steps.publication.outputs.publication_day }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4be28e05f73ad2b3939d364ea8b2817
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python -B -m fluxixo_ai.daily_schedule guard-publication --ledger "$LEDGER" --state "$PUBLISH_STATE" --day "$DAY" --manual-count 0
          else
            python -B -m fluxixo_ai.daily_schedule guard-publication --ledger "$LEDGER" --state "$PUBLISH_STATE" --day "$DAY"
          fi
          python -B fluxixo_daily_rotate.py --add 0 --deploy --deploy-existing

      - name: Record success only after deployment completes
        if: steps.today.outputs.skip != 'true' && steps.publication.outputs.publish == 'true'
        env:
          DAY: ${{ steps.today.outputs.day }}
          RECORD_PUBLICATION: ${{ steps.today.outputs.record_publication }}
        run: |
          if [ "$RECORD_PUBLICATION" = "true" ]; then
            python -B -m fluxixo_ai.daily_schedule mark-published --ledger "$LEDGER" --state "$PUBLISH_STATE" --day "$DAY"
          fi
          git add "$PUBLISH_STATE"
          git add -f fluxixo_site/tools/indexnow-submitted.json fluxixo_site/tools/yandex-indexnow-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): record published daily batch [skip ci]"
            git push origin HEAD:main
          fi

      - name: Report a blocked preparation without spending another allowance
        if: steps.today.outputs.reason == 'interrupted_prepare'
        run: |
          echo "::error::The daily image allowance was already reserved, but the batch is incomplete. No new images were generated by this retry."
          exit 1
