name: DealVault verified build and deployment

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      rotate:
        description: 'Rotate deals count (0 to keep catalog, 7 to rotate deals)'
        required: false
        default: '0' 

permissions:
  contents: read

concurrency:
  group: dealvault-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Dependency installation plus a full 4k-page build exceeded 15 minutes.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Test catalog and failure handling
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --check assets/modern_app.js
          node --check assets/tracking.js
      - name: Observe current public release before updating
        if: github.event_name != 'pull_request'
        run: python submit_indexnow.py --capture
      - name: Build PR without live network updates
        if: github.event_name == 'pull_request'
        run: python dealvault_pipeline.py --offline
      - name: Daily 7-deal rotation and build (on schedule or manual rotate request)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.rotate != '0' && github.event.inputs.rotate != '')
        run: |
          python update_exchange_rates.py
          python daily_rotator.py --count 7
          python dealvault_pipeline.py --offline
      - name: Standard build without marketplace access
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.rotate == '0' || github.event.inputs.rotate == '')
        run: |
          python update_exchange_rates.py
          python dealvault_pipeline.py --offline
      - name: Archive the public artifact
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: dealvault-public-site
          path: dist/
          retention-days: 3
      - name: Headless browser checks
        run: python tests/browser_qa.py --output .qa
      - name: Save the tested catalog before publishing it
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "DealVault updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/reserve_pool.json data/exchange_rates.json data/link_health_report.json data/selection_report.json data/published_routes.json
          if test -f data/rotation_log.json; then git add data/rotation_log.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: save tested catalog snapshots [skip ci]"
            git push origin HEAD:main
          fi
      - name: Publish the verified artifact to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4be28e05f73ad2b3939d364ea8b2817
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is required"; exit 1; }
          npm run deploy
      - name: Verify the public Cloudflare release
        if: github.event_name != 'pull_request'
        run: python verify_deployment.py
      - name: Notify search engines of published changes
        if: github.event_name != 'pull_request'
        run: python submit_indexnow.py --submit
      - name: Keep the original Surge address current
        if: github.event_name != 'pull_request'
        id: mirror
        continue-on-error: true
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npm run deploy:mirror
      - name: Flag mirror failure without hiding primary release status
        if: steps.mirror.outcome == 'failure'
        run: |
          echo "::warning::Cloudflare passed verification, but the Surge mirror failed. Repair the mirror separately."
      - name: Write operational summary
        if: always()
        run: |
          echo "## DealVault operations" >> "$GITHUB_STEP_SUMMARY"
          echo "A successful build is not proof of new products, visits or commission. Review selection_report.json and the partner reports separately." >> "$GITHUB_STEP_SUMMARY"
