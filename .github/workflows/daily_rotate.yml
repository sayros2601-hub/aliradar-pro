name: SmartPick Daily 7-Deal Rotation & Broadcast Engine

on:
  schedule:
    # Runs automatically every day at 06:00 UTC (09:00 Tel Aviv / Moscow)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily-rotation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install Pillow

      - name: Execute Daily 7-Deal Rotation & Promo Generator
        run: |
          python daily_rotator.py --count 7

      - name: Optional Live Deployment (Surge.sh / GitHub Pages)
        run: |
          npx --yes surge . aliradar-pro.surge.sh --token 5dfd0c91ac19588c2de402e4facd9ea2 || true

      - name: Commit & Push Daily Catalog, Deals, and Broadcasts
        run: |
          git config --global user.name "SmartPick Autopilot"
          git config --global user.email "bot@smartpick.click"
          git add data/ deals/ broadcasts/ index.html sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(catalog): daily 7-item rotation [skip ci]" && git push)
