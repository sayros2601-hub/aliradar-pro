name: FLUXIXO one-time authorized validation

on:
  # Headless validation dispatch using Cloudflare Workers AI + GitHub (rembg + Models) — zero Google/Gemini.
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: fluxixo-daily-accumulation
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FLUXIXO_IMAGE_MODE: hybrid
      FLUXIXO_IMAGE_PROVIDER: cloudflare
      FLUXIXO_USE_VISION_SPEC: '1'
      FLUXIXO_STRICT_COPY: '1'
      FLUXIXO_CF_TEXT_MODEL: ${{ vars.FLUXIXO_CF_TEXT_MODEL || '@cf/meta/llama-3.3-70b-instruct-fp8-fast' }}
      FLUXIXO_CF_IMAGE_MODEL: ${{ vars.FLUXIXO_CF_IMAGE_MODEL || '@cf/black-forest-labs/flux-2-klein-9b' }}
      FLUXIXO_CF_VISION_MODEL: ${{ vars.FLUXIXO_CF_VISION_MODEL || '@cf/meta/llama-4-scout-17b-16e-instruct' }}
      FLUXIXO_AI_TRANSPORT: ${{ vars.FLUXIXO_AI_TRANSPORT || 'worker' }}
      CLOUDFLARE_AUTOPILOT_URL: https://fluxixo-autopilot.sayros2601.workers.dev
      CLOUDFLARE_ACCOUNT_ID: a4be28e05f73ad2b3939d364ea8b2817
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the fixed one-time request
        run: |
          python -c 'import json; p=json.load(open("data/validation_requests/fluxixo-validation-20261110-01.json")); assert p == {"run_id":"fluxixo-validation-20261110-01","operation":"validation","count":1}'
      - name: Install bounded OCR dependencies only in cut or hybrid mode
        if: env.FLUXIXO_IMAGE_MODE != 'generate'
        timeout-minutes: 15
        run: bash .github/scripts/install_ocr.sh
      - name: Install existing site and image-quality dependencies
        run: |
          python -m pip install --retries 5 --timeout 60 -r requirements.txt requests
          if [ "${FLUXIXO_IMAGE_MODE,,}" != "generate" ]; then
            python -m pip install --retries 5 --timeout 60 rembg onnxruntime
          fi
          npm ci --ignore-scripts
      - name: Prepare one source-grounded quality-checked product
        id: prepare
        env:
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          AUTOPILOT_SYNC_TOKEN: ${{ secrets.AUTOPILOT_SYNC_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B fluxixo_daily_rotate.py --add 1 --validation-run-id fluxixo-validation-20261110-01
      - name: Commit and push the catalog and one-time ledger before deployment
        if: steps.prepare.outputs.deploy == '1'
        run: |
          git config user.name "FLUXIXO Cloud Autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fluxixo_site/dist fluxixo_site/reserve fluxixo_site/tools data/fluxixo_daily_ledger.json fluxixo_site/release-manifest.json fluxixo_site/asset-map.json
          if [ -f data/fluxixo_ai.sqlite3 ]; then git add -f data/fluxixo_ai.sqlite3; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): one authorized validation product [skip ci]"
            git push origin HEAD:main
          fi
      - name: Record any queued product only after verified push
        if: steps.prepare.outputs.added == '1'
        env:
          NEW_IDS: ${{ steps.prepare.outputs.ids }}
        run: |
          python -B -m fluxixo_ai.autonomous --mark-committed "$(git rev-parse HEAD)" --ids "$NEW_IDS"
          if [ -f data/fluxixo_ai.sqlite3 ]; then git add -f data/fluxixo_ai.sqlite3; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(fluxixo): record validated AI queue item [skip ci]"
            git push origin HEAD:main
          fi
      - name: Deploy the already-built release after push
        if: steps.prepare.outputs.deploy == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4be28e05f73ad2b3939d364ea8b2817
          AUTOPILOT_SYNC_TOKEN: ${{ secrets.AUTOPILOT_SYNC_TOKEN }}
        run: python -B fluxixo_daily_rotate.py --add 0 --deploy --deploy-existing --skip-indexnow
